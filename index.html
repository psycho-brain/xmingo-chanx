<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
　　　<meta http-equiv="Pragma" content="no-cache">
　　　<meta http-equiv="Expires" content="0">
    <title>シンプルクジ引きアプリ</title>
    <style id="app-design">
        /* 基本デザイン（管理画面から変更可能） */
        body {
            font-family: sans-serif;
            background-color: #f7f7f7;
            color: #333333;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header-right {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            cursor: pointer;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            transition: all 0.2s;
        }
        /* クジ引きボタンの形状バリエーション */
        .btn-square { border-radius: 0px; }
        .btn-round { border-radius: 8px; }
        .btn-capsule { border-radius: 50px; }
        .btn-circle { border-radius: 50%; width: 120px; height: 120px; padding: 0; }

        #main-draw-btn {
            background-color: #ff4757;
            color: #ffffff;
            font-size: 24px;
            padding: 15px 40px;
            margin: 40px auto;
            display: block;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
            position: relative;
            color: #333 !important;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
        }
        .item-row {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .preview-img {
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
            display: block;
        }
    </style>
    <!-- 自由なカスタムCSS用の上書き枠 -->
    <style id="custom-css"></style>
</head>
<body>

    <!-- 右上管理用エリア -->
    <div class="header-right">
        <button onclick="syncData()" style="background:#747d8c; color:#fff;">更新（同期）</button>
        <button onclick="openAdmin()" style="background:#2f3542; color:#fff;">管理画面</button>
    </div>

    <!-- トップ画像・メイン画面 -->
    <div style="margin-top: 60px;">
        <h1 id="view-title">お楽しみクジ引き</h1>
        <p id="view-desc">下のボタンを押してクジを引こう！1日3回まで引けます。</p>
        <p id="draw-count-status" style="font-weight: bold;"></p>
        
        <!-- クジ引きボタン（1個のみ） -->
        <button id="main-draw-btn" class="btn-round" onclick="drawKuji()">クジを引く</button>
        
        <button onclick="openHistory()" style="background:#5352ed; color:#fff; margin-top:20px;">当選履歴を見る</button>
    </div>

    <!-- 当選画面モーダル -->
    <div id="modal-result" class="modal">
        <div class="modal-content" style="text-align: center;">
            <span class="close-btn" onclick="closeModal('modal-result')">&times;</span>
            <h2 id="result-serif" style="color: #ff4757;">おめでとうございます！</h2>
            <hr>
            <h3 id="result-item-name" style="font-size: 28px; margin: 20px 0;">---</h3>
            <div id="result-image-container"></div>
            <p style="font-size:12px; color:#aaa; margin-top:15px;">※画像を保存する場合は右クリックまたは長押ししてください</p>
        </div>
    </div>

    <!-- 当選履歴モーダル -->
    <div id="modal-history" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-history')">&times;</span>
            <h2>当選履歴</h2>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- 管理画面モーダル -->
    <div id="modal-admin" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <span class="close-btn" onclick="closeModal('modal-admin')">&times;</span>
            <h2>管理画面（管理者2名用）</h2>
            
            <!-- ログインフォーム -->
            <div id="admin-login-box">
                <p>パスワードを入力してください：</p>
                <input type="password" id="admin-pass" style="padding:10px; width:200px;">
                <button onclick="checkLogin()" style="background:#2ed573; color:#fff;">ログイン</button>
            </div>

            <!-- 管理コンテンツ（ログイン後表示） -->
            <div id="admin-main-box" style="display: none;">
                <div style="background:#f1f2f6; padding:15px; margin-bottom:15px; border-radius:5px;">
                    <h3>制限・セリフ設定</h3>
                    <label>1日のプレイ可能回数: <input type="number" id="cfg-max-draw" min="1" style="width:60px; padding:5px;"></label>
                    <button onclick="resetTodayCount()" style="background:#ffa502; color:#fff; padding:5px 10px; font-size:12px; margin-left:10px;">本日の回数を全員リセット</button>
                    <br><br>
                    <label>当選時の共通セリフ: <input type="text" id="cfg-serif" style="width:80%; padding:5px;"></label>
                </div>

                <div style="background:#f1f2f6; padding:15px; margin-bottom:15px; border-radius:5px;">
                    <h3>デザイン設定</h3>
                    背景色: <input type="color" id="cfg-bg-color"> | 
                    文字色: <input type="color" id="cfg-text-color"> | 
                    ボタン色: <input type="color" id="cfg-btn-color"><br><br>
                    背景画像URL: <input type="text" id="cfg-bg-img" style="width:80%; padding:5px;"><br><br>
                    ボタンの形: 
                    <select id="cfg-btn-shape" style="padding:5px;">
                        <option value="btn-square">四角</option>
                        <option value="btn-round">角丸</option>
                        <option value="btn-capsule">カプセル型</option>
                        <option value="btn-circle">正円</option>
                    </select>
                    <br><br>
                    カスタムCSS:<br>
                    <textarea id="cfg-custom-css" rows="4" style="width:95%; font-family:monospace;" placeholder="body { border: 5px solid red; }"></textarea>
                </div>

                <div style="background:#f1f2f6; padding:15px; border-radius:5px;">
                    <h3>アイテム管理</h3>
                    <div style="border: 1px dashed #ccc; padding: 10px; margin-bottom: 10px; background:#fff;">
                        <strong>【新規アイテム追加】</strong><br><br>
                        名称: <input type="text" id="new-item-name" style="width:200px; padding:5px;">
                        個数(1-100): <input type="number" id="new-item-count" value="1" min="1" max="100" style="width:60px; padding:5px;"><br><br>
                        画像: <input type="file" id="new-item-file" accept="image/*" onchange="handleFileSelect(this)"><br>
                        <div id="new-img-preview-area" style="margin-top:5px; display:none;">
                            <img id="new-img-preview" class="preview-img">
                            <button onclick="clearUploadImage()" style="background:#ff4757; color:#fff; padding:2px 5px; font-size:12px; margin-top:2px;">画像を削除</button>
                        </div>
                        <br>
                        <button onclick="addItem()" style="background:#2ed573; color:#fff; width:100%;">このアイテムを追加登録する</button>
                    </div>

                    <div id="admin-item-list"></div>
                </div>
                
                <br>
                <button onclick="saveAdminSettings()" style="background:#1e90ff; color:#fff; width:100%; padding:12px; font-size:18px; font-weight:bold;">すべての管理設定を保存する</button>
            </div>
        </div>
    </div>

    <script>
        // --- 初期設定とデータ定義（コードから直接複数追加可能） ---
        const INITIAL_ITEMS = [
            { id: "init_1", name: "サンプル特賞アイテム", count: 1, img: "" },
            { id: "init_2", name: "サンプルA賞アイテム", count: 10, img: "" },
            { id: "init_3", name: "サンプルB賞アイテム", count: 50, img: "" }
        ];

        // グローバル変数群
        let items = [];
        let historyLog = [];
        let config = {
            maxDraw: 3,
            serif: "おめでとうございます！🎉",
            bgColor: "#f7f7f7",
            textColor: "#333333",
            btnColor: "#ff4757",
            bgImg: "",
            btnShape: "btn-round",
            customCss: ""
        };
        let tmpImageBase64 = "";

        // アプリ起動時の初期化
        window.onload = function() {
            // ローカルストレージからデータ復元、無ければ初期値を充当
            items = JSON.parse(localStorage.getItem('kuji_items'));
            if (!items || items.length === 0) {
                items = INITIAL_ITEMS;
                localStorage.setItem('kuji_items', JSON.stringify(items));
            }
            historyLog = JSON.parse(localStorage.getItem('kuji_history')) || [];
            
            const savedConfig = JSON.parse(localStorage.getItem('kuji_config'));
            if (savedConfig) config = savedConfig;

            // 深夜0時のリセット判定
            checkDateReset();
            
            // 画面反映
            applyDesign();
            updateDrawStatus();

            // ブラウザ「更新」後も管理画面のログイン状態を継続する仕組み (sessionStorage)
            if (sessionStorage.getItem('admin_logged_in') === 'true') {
                document.getElementById('admin-login-box').style.display = 'none';
                document.getElementById('admin-main-box').style.display = 'block';
                renderAdminItems();
                fillAdminFields();
                // もしセッションが残っていたら管理画面を開いたままにする
                openAdmin();
            }
        };

        // 深夜0時をまたいだら自動的にクジ引き回数をリセットする処理
        function checkDateReset() {
